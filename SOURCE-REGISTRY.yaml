# 初始來源候選，並非完整涵蓋清單
sources:
  - source_id: openai-news
    name: OpenAI 新聞室
    url: https://openai.com/news/rss.xml
    home: https://openai.com/news/
    topic: AI
    language: en
    type: first_party_announcement
    fetch: rss
    trust_note: 廠商聲明須與獨立證實分開
  - source_id: moenv
    name: 台灣環境部
    url: https://enews.moenv.gov.tw/News/List?Lang=zh-tw&key=11
    home: https://enews.moenv.gov.tw/
    topic: 環境
    language: zh-TW
    type: government
    fetch: html_list
    trust_note: 候選清單未提供日期時保留空值，須進原文核對
  - source_id: openai
    name: OpenAI Python SDK
    url: https://api.github.com/repos/openai/openai-python/releases?per_page=6
    home: https://github.com/openai/openai-python/releases
    topic: AI
    language: en
    type: first_party_release
    fetch: github_json
    trust_note: 廠商一手發布，不代表獨立證實
  - source_id: node
    name: Node.js
    url: https://api.github.com/repos/nodejs/node/releases?per_page=6
    home: https://github.com/nodejs/node/releases
    topic: IT
    language: en
    type: first_party_release
    fetch: github_json
  - source_id: cisa
    name: CISA 已知遭利用漏洞目錄
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    home: https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    topic: 資安
    language: en
    type: government
    fetch: json
  - source_id: nasa
    name: NASA Earth Observatory
    url: https://earthobservatory.nasa.gov/feeds/earth-observatory.rss
    home: https://earthobservatory.nasa.gov/
    topic: 環境
    language: en
    type: government
    fetch: rss
# 不擷取付費全文，僅公開標題、短摘錄及連結；完整來源授權清查待完成。
